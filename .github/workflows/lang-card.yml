name: build language card

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_lang_card.py"
      - ".github/workflows/lang-card.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_lang_card.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --staged --quiet || git commit -m "chore: update language card"
          git push
